name: Tag patch version on merge to release

on:
  push:
    branches:
      - release
      - 'release/**'

permissions:
  contents: write

# One release line must not race with itself; different lines may run in parallel.
concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Compute next patch version
        id: ver
        run: |
          set -euo pipefail

          # The commit on main this release branched from.
          base="$(git merge-base origin/main HEAD)"

          # Its version, as tagged by the main-branch workflow.
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$base" 2>/dev/null || true)"
          if [ -z "$base_tag" ]; then
            echo "::error::No semver tag reachable from main commit $base; cannot derive a release version."
            exit 1
          fi

          v="${base_tag#v}"
          major="${v%%.*}"
          rest="${v#*.}"
          minor="${rest%%.*}"

          # Highest patch already issued on this major.minor line.
          latest="$(git tag -l "v${major}.${minor}.[0-9]*" --sort=-v:refname | head -n1)"
          [ -n "$latest" ] || latest="$base_tag"
          patch="${latest##*.}"

          next="v${major}.${minor}.$((patch + 1))"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Branched from $base ($base_tag); latest on line: $latest -> next: $next"

      - name: Create and push tag
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "Tag $NEXT already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "refs/tags/$NEXT"
          echo "Pushed tag $NEXT" >> "$GITHUB_STEP_SUMMARY"
